<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yonca Keşkek Türk | Contact</title>
    <link rel="stylesheet" href="styles.css?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Üst Menü -->
    <header class="navbar">
        <div class="logo">Yonca Keşkek Türk</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- İletişim İçeriği -->
        <section class="split-section">
            <div class="content-box bg-gray">
                <h1 class="text-dark">Get in touch</h1>
                <form class="contact-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name (required)</label>
                            <input type="text" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name (required)</label>
                            <input type="text" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email (required)</label>
                        <input type="email" required>
                    </div>
                    <div class="form-group">
                        <label>Message (required)</label>
                        <textarea rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-solid">SEND</button>
                </form>
            </div>
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1610307991316-db6d3cb21fb3?auto=format&fit=crop&w=1000&q=80" alt="Ahşap Atölyesi">
            </div>
        </section>
    </main>

</body>
</html>
