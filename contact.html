<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yonca Keşkek Türk | Contact</title>
    <!-- v=6 yaparak CSS'in güncellenmesini sağlıyoruz -->
    <link rel="stylesheet" href="styles.css?v=6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Üst Menü -->
    <header class="navbar">
        <div class="logo">Yonca Keşkek Türk</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- İletişim İçeriği -->
        <section class="split-section">
            <div class="content-box bg-gray">
                <h1 class="text-dark">Get in touch</h1>
                
                <!-- MAİL GÖNDERME FORMU -->
                <!-- action kısmına kendi mail adresini yazmalısın -->
                <form action="https://formsubmit.co/yoncakeskekturk@outlook.com" method="POST" class="contact-form">
                    
                    <!-- Mesaj gönderildikten sonra kullanıcının sitene geri dönmesi için -->
                    <input type="hidden" name="_next" value="https://yoncakeskekturk.com/contact.html">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name (required)</label>
                            <input type="text" name="İsim" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name (required)</label>
                            <input type="text" name="Soyisim" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email (required)</label>
                        <input type="email" name="Email" required>
                    </div>
                    <div class="form-group">
                        <label>Message (required)</label>
                        <textarea name="Mesaj" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-solid">SEND</button>
                </form>

                <!-- SOSYAL MEDYA BUTONLARI -->
                <div class="social-links">
                    <p class="text-small">Or connect with me on:</p>
                    <div class="social-buttons-container">
                        <a href="https://linkedin.com/in/yoncakeskekturk" target="_blank" class="social-btn">LinkedIn</a>
                        <a href="https://twitter.com/KeskekTurk" target="_blank" class="social-btn">X (Twitter)</a>
                    </div>
                </div>

            </div>
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1610307991316-db6d3cb21fb3?auto=format&fit=crop&w=1000&q=80" alt="Ahşap Atölyesi">
            </div>
        </section>
    </main>

</body>
</html>
