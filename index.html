<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yonca Keşkek Türk | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #181514; /* Sıcak çikolata/espresso zemin */
      color: #b0a498;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Işık efekti */
    .spotlight {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(600px at 50% 50%, rgba(232, 178, 152, 0.12), transparent 80%);
    }

    .card {
      position: relative;
      z-index: 2;
      max-width: 540px;
      width: 100%;
      text-align: center;
      background: rgba(43, 37, 34, 0.45);
      border: 1px solid rgba(232, 178, 152, 0.15);
      padding: 56px 40px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #e8b298;
      background: rgba(232, 178, 152, 0.1);
      border: 1px solid rgba(232, 178, 152, 0.2);
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      color: #f7eedd;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #b0a498;
      margin-bottom: 32px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      border-top: 1px solid rgba(232, 178, 152, 0.1);
      padding-top: 28px;
    }

    .social-links a {
      color: #8c7e73;
      transition: all 0.2s ease;
    }

    .social-links a:hover {
      color: #e8b298;
      transform: translateY(-2px);
    }

    .social-links svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    @media (max-width: 480px) {
      .card {
        padding: 40px 24px;
      }
      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <div class="spotlight" id="spotlight"></div>

  <main class="card">
    <span class="badge">Under Construction</span>
    <h1>Yonca Keşkek Türk</h1>
    <p>Something thoughtful is in the works. The website is currently under construction and will be launched soon.</p>

    <!-- Sosyal Medya İkonları -->
    <div class="social-links">
      <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-.2063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="https://github.com" target="_blank" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
      <a href="mailto:eposta@adresiniz.com" aria-label="Email" title="Email">
        <svg viewBox="0 0 24 24"><path d="M0 3v18h24v-18h-24zm21.518 2l-9.518 7.713-9.518-7.713h19.036zm-19.518 14v-11.817l10 8.104 10-8.104v11.817h-20z"/></svg>
      </a>
    </div>
  </main>

  <script>
    const spotlight = document.getElementById('spotlight');
    window.addEventListener('mousemove', (e) => {
      spotlight.style.background = `radial-gradient(600px at ${e.clientX}px ${e.clientY}px, rgba(232, 178, 152, 0.12), transparent 80%)`;
    });
  </script>
</body>
</html>
